<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Easter Learning</title>
  <meta name="description" content="¡Buen ojo! Encontraste un Easter Egg. Bienvenido a Easter Learning.">
  <meta name="theme-color" content="#0b1640">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0e1d4c;
      --navy-deep: #081236;
      --white: #ffffff;
      --soft: rgba(255, 255, 255, .78);
      --font-body: "Baloo 2", "Trebuchet MS", Arial, sans-serif;
      --font-tech: "Audiowide", "Arial Black", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--navy-deep);
      color: var(--white);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

    /* =========================================================
       FONDO (todo animado con transform/opacity: fluido)
       ========================================================= */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 35%, #142a6c 0%, #0e1d4c 48%, #081236 100%);
      contain: strict;
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
    }
    .aurora--1 { width: 80vmax; height: 80vmax; left: -30vmax; top: -38vmax;
      background: radial-gradient(circle, rgba(0, 99, 229, .5) 0%, rgba(0, 99, 229, .18) 35%, transparent 68%);
      animation: drift1 24s ease-in-out infinite alternate; }
    .aurora--2 { width: 70vmax; height: 70vmax; right: -30vmax; bottom: -32vmax;
      background: radial-gradient(circle, rgba(0, 200, 255, .3) 0%, rgba(0, 200, 255, .1) 35%, transparent 68%);
      animation: drift2 28s ease-in-out infinite alternate; }
    .aurora--3 { width: 60vmax; height: 60vmax; left: 20%; top: 40%;
      background: radial-gradient(circle, rgba(100, 60, 230, .26) 0%, rgba(100, 60, 230, .08) 35%, transparent 68%);
      animation: drift3 32s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate3d(18vmax, 14vmax, 0) scale(1.12); } }
    @keyframes drift2 { to { transform: translate3d(-16vmax, -12vmax, 0) scale(1.08); } }
    @keyframes drift3 { to { transform: translate3d(-24vmax, -16vmax, 0) scale(1.18); } }

    /* líneas del ojo gigante */
    .bg__lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bg__lines path { fill: none; stroke: rgba(70, 160, 255, .18); stroke-width: 1.6; }

    /* estrellas: 2 capas que titilan alternadas */
    .stars { position: absolute; inset: 0; width: 100%; height: 100%; will-change: opacity; }
    .stars--a { animation: twinkle 4s ease-in-out infinite alternate; }
    .stars--b { animation: twinkle 5s ease-in-out -2.5s infinite alternate; }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

    /* estrella fugaz */
    .shoot {
      position: absolute;
      top: 12%;
      left: -10%;
      width: 160px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, rgba(220, 245, 255, .95));
      transform: rotate(18deg);
      opacity: 0;
      will-change: transform, opacity;
      animation: shoot 9s ease-in 3s infinite;
    }
    @keyframes shoot {
      0%   { transform: translate3d(0, 0, 0) rotate(18deg); opacity: 0; }
      2%   { opacity: 1; }
      10%  { transform: translate3d(60vw, 19vw, 0) rotate(18deg); opacity: 0; }
      100% { transform: translate3d(60vw, 19vw, 0) rotate(18deg); opacity: 0; }
    }

    /* =========================================================
       CONTENIDO
       ========================================================= */
    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 56px 24px calc(120px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .content { width: 100%; max-width: 860px; display: flex; flex-direction: column; align-items: center; }

    /* 1 · Encabezado */
    .title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 3%;
      width: 100%;
    }
    .title img { height: clamp(34px, 11.5vw, 62px); width: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .subtitle {
      margin-top: 14px;
      font-size: clamp(1rem, 4.3vw, 1.3rem);
      font-weight: 600;
      color: var(--soft);
      line-height: 1.25;
    }

    /* 2 · Barra de carga */
    .pill {
      position: relative;
      margin-top: 40px;
      width: min(100%, 440px);
      height: 50px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      isolation: isolate;
    }
    .pill__fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      background: linear-gradient(90deg, #00a3ab, #5ee6ea);
      transform: translate3d(calc(var(--p, 0) * 1% - 100%), 0, 0);
      will-change: transform;
    }
    .pill__fill::after { /* rayas que avanzan */
      content: "";
      position: absolute;
      inset: 0 -40px 0 0;
      background: repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 10px, transparent 10px 20px);
      animation: stripes .6s linear infinite;
      will-change: transform;
    }
    @keyframes stripes { to { transform: translate3d(28.28px, 0, 0); } }

    .pill__load, .pill__done {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pill__load {
      gap: .5em;
      font-family: var(--font-tech);
      font-size: clamp(.78rem, 3.4vw, .95rem);
      letter-spacing: .08em;
      text-shadow: 0 1px 6px rgba(8, 18, 54, .6);
      transition: opacity .2s ease;
    }
    .pill__pct { min-width: 3.6ch; text-align: left; font-weight: 400; }

    .pill__white {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--white);
      opacity: 0;
      transition: opacity .25s ease;
    }
    .pill__done {
      gap: 10px;
      opacity: 0;
      transform: scale(.7);
    }
    .pill__check { width: 22px; height: 22px; flex: none; }
    .pill__check path { stroke-dasharray: 24; stroke-dashoffset: 24; }
    .pill__done img { height: 16px; width: auto; }

    .pill__shine {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(100deg, transparent 30%, rgba(0, 200, 210, .45) 50%, transparent 70%);
      transform: translate3d(-110%, 0, 0);
      pointer-events: none;
    }

    .pill.is-done { border-color: var(--white); animation: ring 1.1s ease-out; }
    .pill.is-done .pill__white { opacity: 1; }
    .pill.is-done .pill__load { opacity: 0; }
    .pill.is-done .pill__done { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) forwards; }
    .pill.is-done .pill__check path { animation: draw .45s ease .25s forwards; }
    .pill.is-done .pill__shine { animation: shine .9s ease .15s; }
    @keyframes pop   { to { opacity: 1; transform: scale(1); } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes shine { to { transform: translate3d(110%, 0, 0); } }
    @keyframes ring {
      0%   { box-shadow: 0 0 0 0 rgba(0, 200, 210, .8); }
      100% { box-shadow: 0 0 0 20px rgba(0, 200, 210, 0); }
    }

    /* 3 · Identidad detectada */
    .identity {
      margin-top: 26px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(18px, 5vw, 32px);
    }
    .identity__col { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; }
    .identity__label {
      font-size: clamp(.62rem, 2.6vw, .78rem);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--soft);
      white-space: nowrap;
      line-height: 1;
    }
    .identity__value { height: clamp(24px, 6.8vw, 34px); width: auto; }
    .identity__sep { width: 1.5px; background: rgba(255, 255, 255, .4); transform: scaleY(0); }

    .identity__col.is-in { animation: scanIn .7s steps(12) forwards; }
    .identity__sep.is-in { animation: grow .4s ease forwards; }
    @keyframes scanIn { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
    @keyframes grow { to { transform: scaleY(1); } }

    /* 4 · Mensaje */
    .message {
      margin-top: 52px;
      font-size: clamp(1rem, 4.2vw, 1.2rem);
      font-weight: 600;
      line-height: 1.45;
      max-width: 34ch;
      color: rgba(255, 255, 255, .88);
    }
    .message p { text-wrap: balance; }
    .message p + p { margin-top: 14px; }
    .message .strong { font-weight: 800; color: var(--white); }
    .br-pc { display: none; }

    /* 5 · Cierre */
    .welcome {
      margin-top: 40px;
      font-size: clamp(.95rem, 4vw, 1.1rem);
      font-weight: 600;
      color: var(--soft);
    }
    .brand { margin-top: 10px; }
    .brand img { width: min(72vw, 420px); }

    /* entrada escalonada */
    .reveal { opacity: 0; transform: translate3d(0, 14px, 0); }
    .reveal.is-in { animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards; }
    @keyframes rise { to { opacity: 1; transform: translate3d(0, 0, 0); } }

    /* =========================================================
       OJO + DISNEY+
       ========================================================= */
    .eye {
      position: fixed;
      z-index: 1;
      right: -32vw;
      bottom: -16vw;
      width: 90vw;
      max-width: 700px;
      aspect-ratio: 1;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      opacity: 0;
      animation: appear 1.4s ease .3s forwards;
      -webkit-tap-highlight-color: transparent;
    }
    .eye__float { display: block; width: 100%; height: 100%; animation: float 7s ease-in-out infinite; will-change: transform; }
    .eye__look {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0) rotate(var(--rot, 0deg)) scale(var(--sc, 1));
      transition: transform var(--dur, .35s) cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }
    .eye__img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .7; transition: opacity .45s ease; }
    .eye__img--b { opacity: 0; }
    .eye:hover .eye__img--b, .eye.is-active .eye__img--b { opacity: 1; }
    .eye:hover .eye__look, .eye.is-active .eye__look { --sc: 1.04; }
    .eye.is-blink .eye__look { animation: blink .45s ease; }

    @keyframes appear { to { opacity: 1; } }
    @keyframes float  { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -10px, 0); } }
    @keyframes blink  { 0%, 100% { scale: 1 1; } 45% { scale: 1 .08; } }

    .disney {
      position: absolute;
      z-index: 3;
      right: calc(18px + env(safe-area-inset-right));
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: clamp(78px, 22vw, 130px);
      opacity: 0;
      animation: appear 1s ease .6s forwards;
    }

    /* =========================================================
       PC
       ========================================================= */
    @media (min-width: 900px) {
      .screen { padding: 64px 48px 96px; }
      .title { flex-wrap: nowrap; gap: 0 2.2%; }
      .title img { height: 68px; }
      .subtitle { margin-top: 18px; }
      .pill { margin-top: 44px; height: 54px; }
      .message { margin-top: 56px; max-width: 60ch; }
      .br-pc { display: inline; }
      .welcome { margin-top: 36px; }
      .brand img { width: 400px; }
      .eye { right: -150px; bottom: -210px; width: 620px; }
      .disney { right: 44px; bottom: 36px; }
    }

    /* pantallas bajitas en PC: todo un poco más chico para que entre */
    @media (min-width: 900px) and (max-height: 820px) {
      .screen { padding-top: 40px; padding-bottom: 70px; }
      .title img { height: 54px; }
      .pill { margin-top: 32px; }
      .message { margin-top: 40px; }
      .welcome { margin-top: 26px; }
      .brand img { width: 340px; }
    }

    /* pantallas grandes */
    @media (min-width: 1600px) and (min-height: 950px) {
      .title img { height: 86px; }
      .subtitle { font-size: 1.5rem; }
      .pill { width: 520px; height: 58px; }
      .pill__load { font-size: 1.05rem; }
      .pill__done img { height: 18px; }
      .identity__label { font-size: .88rem; }
      .identity__value { height: 42px; }
      .message { font-size: 1.4rem; }
      .welcome { font-size: 1.25rem; }
      .brand img { width: 500px; }
      .disney { width: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora, .stars, .shoot, .pill__fill::after, .eye, .eye__float, .disney { animation: none !important; }
      .eye, .disney { opacity: 1; }
      .reveal, .identity__col { opacity: 1; transform: none; }
      .reveal.is-in, .identity__col.is-in, .identity__sep.is-in, .pill.is-done .pill__done, .pill.is-done .pill__check path { animation: none; opacity: 1; transform: none; clip-path: none; stroke-dashoffset: 0; }
      .identity__sep { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="aurora aurora--1"></div>
    <div class="aurora aurora--2"></div>
    <div class="aurora aurora--3"></div>
    <svg class="bg__lines" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <path d="M-200 470 Q 800 -330 1800 470"/>
      <path d="M-200 470 Q 800 1270 1800 470"/>
      <path d="M-200 520 Q 800 -180 1800 520"/>
    </svg>
    <canvas class="stars stars--a"></canvas>
    <canvas class="stars stars--b"></canvas>
    <span class="shoot"></span>
  </div>

  <button class="eye" type="button" aria-label="Ojo: tocame">

  <script>
    (function () {
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var $ = function (s) { return document.querySelector(s); };
      var wait = function (ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); };

      /* ---------- Estrellas: se dibujan UNA vez (no cada cuadro) ---------- */
      function paintStars() {
        var dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
        document.querySelectorAll('.stars').forEach(function (cv) {
          cv.width = w * dpr; cv.height = h * dpr;
          var c = cv.getContext('2d'), n = Math.round(w * h / 14000);
          c.fillStyle = 'rgba(175, 228, 255, .85)';
          for (var i = 0; i < n; i++) {
            c.beginPath();
            c.arc(Math.random() * cv.width, Math.random() * cv.height, (Math.random() * 1.2 + .35) * dpr, 0, 6.283);
            c.fill();
          }
        });
      }
      paintStars();
      var rz; addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(paintStars, 200); });

      /* ---------- Secuencia ---------- */
      document.querySelectorAll('.reveal[data-t]').forEach(function (el) {
        setTimeout(function () { el.classList.add('is-in'); }, reduce ? 0 : +el.dataset.t);
      });

      var pill = $('.pill'), pct = $('.pill__pct');

      function load() {
        return new Promise(function (resolve) {
          if (reduce) { pill.style.setProperty('--p', 100); return resolve(); }
          var keys = [[0,0],[.16,13],[.28,20],[.37,22],[.54,57],[.65,62],[.72,63],[.87,91],[.94,97],[1,100]];
          var dur = 1700, t0, last = -1;
          function frame(now) {
            if (!t0) t0 = now;
            var t = Math.min((now - t0) / dur, 1), p = 100;
            for (var i = 1; i < keys.length; i++) {
              if (t <= keys[i][0]) { var a = keys[i-1], b = keys[i]; p = a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]); break; }
            }
            pill.style.setProperty('--p', p.toFixed(1));
            var r = Math.round(p);
            if (r !== last) { pct.textContent = r + '%'; last = r; }
            if (t < 1) requestAnimationFrame(frame); else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      wait(700)
        .then(load)
        .then(function () { return wait(120); })
        .then(function () {
          pill.classList.add('is-done');
          pill.setAttribute('aria-label', 'Análisis completado');
          return wait(550);
        })
        .then(function () {
          var cols = document.querySelectorAll('.identity__col');
          cols[0].classList.add('is-in');
          $('.identity__sep').classList.add('is-in');
          return wait(400).then(function () { cols[1].classList.add('is-in'); return wait(750); });
        })
        .then(function () {
          var steps = document.querySelectorAll('.reveal[data-step]');
          steps.forEach(function (el, i) { setTimeout(function () { el.classList.add('is-in'); }, reduce ? 0 : i * 350); });
          return wait(steps.length * 350 + 300);
        })
        .then(wakeEye);

      /* ---------- Ojo interactivo ---------- */
      var eye = $('.eye'), look = $('.eye__look'), brand = $('.brand'), lastInput = 0, tiltOn = false, raf = 0, pending = null;

      // agrupa los movimientos en un solo cuadro de animación
      function apply() {
        raf = 0;
        if (!pending) return;
        look.style.setProperty('--dur', pending.dur);
        look.style.setProperty('--tx', pending.tx + 'px');
        look.style.setProperty('--ty', pending.ty + 'px');
        look.style.setProperty('--rot', pending.rot + 'deg');
        pending = null;
      }
      function set(tx, ty, rot, dur) {
        pending = { tx: tx.toFixed(1), ty: ty.toFixed(1), rot: rot.toFixed(1), dur: dur || '.35s' };
        if (!raf) raf = requestAnimationFrame(apply);
      }
      var eyeBox = null;
      function box() { if (!eyeBox) eyeBox = eye.getBoundingClientRect(); return eyeBox; }
      addEventListener('resize', function () { eyeBox = null; });

      function gaze(x, y, dur) {
        if (reduce) return;
        var r = box(), dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
        var d = Math.max(Math.hypot(dx, dy), 1), k = Math.min(d / 260, 1) * 24;
        set(dx / d * k, dy / d * k, dx / d * 7, dur);
      }
      function userLook(x, y) { lastInput = Date.now(); gaze(x, y); }

      addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') userLook(e.clientX, e.clientY); }, { passive: true });
      addEventListener('pointerdown', function (e) { userLook(e.clientX, e.clientY); }, { passive: true });

      function onTilt(e) {
        if (e.gamma == null) return;
        tiltOn = true; lastInput = Date.now();
        var gx = Math.max(-30, Math.min(30, e.gamma)) / 30, gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;
        set(gx * 24, gy * 18, gx * 7, '.25s');
      }
      if (!reduce && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
        addEventListener('deviceorientation', onTilt, { passive: true });
      }

      function pulse() { eye.classList.add('is-active'); setTimeout(function () { eye.classList.remove('is-active'); }, 1100); }
      function blink() { eye.classList.remove('is-blink'); void eye.offsetWidth; eye.classList.add('is-blink'); }
      look.addEventListener('animationend', function (e) { if (e.animationName === 'blink') eye.classList.remove('is-blink'); });

      function wander() {
        if (!document.hidden && Date.now() - lastInput > 2500) {
          var w = innerWidth, h = innerHeight, x, y, roll = Math.random();
          if (roll < .3) { var b = brand.getBoundingClientRect(); x = b.left + b.width * Math.random(); y = b.top + b.height / 2; }
          else if (roll < .45) { x = w / 2; y = h / 2; }
          else { x = Math.random() * w; y = Math.random() * h; }
          gaze(x, y, (.6 + Math.random() * .6).toFixed(2) + 's');
        }
        setTimeout(wander, 1400 + Math.random() * 1700);
      }

      function wakeEye() {
        if (reduce) return;
        var b = brand.getBoundingClientRect();
        gaze(b.left + b.width / 2, b.top + b.height / 2, '.8s');
        pulse();
        setTimeout(wander, 1800);
        setInterval(function () { if (!document.hidden) blink(); }, 5000);
        if (matchMedia('(hover: none)').matches) {
          setInterval(function () { if (!document.hidden && Date.now() - lastInput > 2500) pulse(); }, 9000);
        }
      }

      var timer;
      eye.addEventListener('click', function () {
        if (!tiltOn && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (st) {
            if (st === 'granted') addEventListener('deviceorientation', onTilt, { passive: true });
          }).catch(function () {});
        }
        blink();
        eye.classList.add('is-active');
        if (navigator.vibrate) navigator.vibrate(15);
        clearTimeout(timer);
        timer = setTimeout(function () { eye.classList.remove('is-active'); }, 1400);
      });
    })();
  </script>
</body>
</html>
