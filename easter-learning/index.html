<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Easter Learning</title>
  <meta name="description" content="¡Buen ojo! Encontraste un Easter Egg. Bienvenido a Easter Learning.">
  <meta name="theme-color" content="#0b1640">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0e1d4c;
      --navy-deep: #081236;
      --white: #ffffff;
      --dplus: #0063e5;      /* azul Disney+ */
      --cyan: #18c8ff;
      --glow: rgba(24, 170, 255, .75);
      --font-body: "Baloo 2", "Trebuchet MS", Arial, sans-serif;
      --font-tech: "Audiowide", "Arial Black", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      background: var(--navy-deep);
      color: var(--white);
      font-family: var(--font-body);
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

    /* =========================================================
       FONDO DINÁMICO (colores Disney+)
       ========================================================= */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 40%, #13286a 0%, #0e1d4c 45%, #081236 100%);
    }

    /* auroras que se mueven lento */
    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .55;
      will-change: transform;
    }
    .aurora--1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax;
      background: radial-gradient(circle, rgba(0, 99, 229, .65), transparent 65%);
      animation: drift1 22s ease-in-out infinite alternate; }
    .aurora--2 { width: 60vmax; height: 60vmax; right: -25vmax; bottom: -25vmax;
      background: radial-gradient(circle, rgba(0, 209, 255, .38), transparent 65%);
      animation: drift2 26s ease-in-out infinite alternate; }
    .aurora--3 { width: 50vmax; height: 50vmax; left: 30%; top: 45%;
      background: radial-gradient(circle, rgba(92, 52, 220, .32), transparent 65%);
      animation: drift3 30s ease-in-out infinite alternate; }

    @keyframes drift1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-16vmax, -12vmax) scale(1.1); } }
    @keyframes drift3 { to { transform: translate(-22vmax, -18vmax) scale(1.25); } }

    /* el ojo gigante del fondo (líneas que brillan) */
    .bg__lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .bg__lines path {
      fill: none;
      stroke: rgba(60, 150, 255, .22);
      stroke-width: 2;
    }
    .bg__lines .flow {
      stroke: rgba(120, 220, 255, .85);
      stroke-width: 2.5;
      stroke-dasharray: 160 2400;
      animation: flow 9s linear infinite;
      filter: url(#soft);
    }
    .bg__lines .flow--b { animation-delay: -4.5s; animation-duration: 11s; }
    @keyframes flow { from { stroke-dashoffset: 2560; } to { stroke-dashoffset: 0; } }

    /* estrellitas */
    .bg__stars { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* =========================================================
       CONTENIDO
       ========================================================= */
    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 22px calc(96px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .content {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Título: 2 líneas en celular, 1 en PC */
    .title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .35em 3.2%;
      width: 100%;
      filter: drop-shadow(0 0 18px rgba(24, 140, 255, .35));
    }
    .title img { height: clamp(42px, 15.5vw, 70px); width: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(1.2rem, 5.2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.15;
      text-wrap: balance;
    }

    /* =========================================================
       BARRA DE CARGA
       ========================================================= */
    .meter {
      margin-top: 22px;
      width: min(100%, 760px);
      display: flex;
      align-items: center;
      gap: clamp(14px, 4vw, 30px);
    }
    .meter__end { height: clamp(12px, 3.4vw, 26px); width: auto; flex: none;
      filter: drop-shadow(0 0 8px rgba(24, 170, 255, .6)); }

    .bar {
      position: relative;
      flex: 1;
      height: clamp(50px, 13vw, 66px);
      padding: 6px;
      border-radius: 16px;
      border: 2px solid rgba(40, 175, 255, .95);
      background: rgba(4, 20, 64, .65);
      box-shadow: 0 0 14px var(--glow), inset 0 0 12px rgba(0, 150, 255, .55);
    }
    /* marco exterior finito + "ganchitos" laterales */
    .bar::before {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 22px;
      border: 1.5px solid rgba(40, 175, 255, .5);
      box-shadow: 0 0 10px rgba(24, 170, 255, .35);
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 18% clamp(-16px, -2.6vw, -10px);
      border-left: 3px solid rgba(40, 175, 255, .8);
      border-right: 3px solid rgba(40, 175, 255, .8);
      border-radius: 4px;
      pointer-events: none;
    }

    .track {
      position: relative;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid rgba(170, 235, 255, .95);
      background: rgba(0, 70, 170, .35);
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--p, 0%);
      background: linear-gradient(180deg, #4fdcff 0%, #11a4ff 45%, #0477ea 100%);
      box-shadow: 0 0 18px #19b6ff;
      transition: width .1s linear;
    }
    .fill::after { /* rayas diagonales que avanzan */
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(-55deg, rgba(255,255,255,.2) 0 14px, transparent 14px 34px);
      background-size: 41.5px 100%;
      animation: stripes 1s linear infinite;
    }
    @keyframes stripes { to { background-position: 41.5px 0; } }

    .track__label {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading {
      font-family: var(--font-tech);
      font-weight: 400;
      font-size: clamp(.8rem, 3.6vw, 1.25rem);
      letter-spacing: .08em;
      text-shadow: 0 0 10px rgba(0, 40, 120, .9);
      transition: opacity .2s ease;
    }
    .loading b { font-weight: 400; display: inline-block; min-width: 3.4ch; text-align: right; }
    .done-text {
      position: absolute;
      height: 46%;
      width: auto;
      opacity: 0;
      transform: scale(.6);
      filter: drop-shadow(0 0 6px rgba(0, 40, 140, .8));
    }

    /* destellos tipo estrella en el marco */
    .spark {
      position: absolute;
      z-index: 3;
      width: 26px;
      height: 26px;
      background:
        radial-gradient(circle, #fff 0 2px, rgba(120, 220, 255, .9) 3px, transparent 9px),
        linear-gradient(90deg, transparent 46%, rgba(200, 245, 255, .95) 50%, transparent 54%),
        linear-gradient(0deg, transparent 46%, rgba(200, 245, 255, .95) 50%, transparent 54%);
      border-radius: 50%;
      animation: twinkle 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .spark--a { top: -22px; right: 7%; }
    .spark--b { bottom: -22px; left: 9%; animation-delay: -1.2s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(.5) rotate(0deg); opacity: .5; }
      50%      { transform: scale(1.1) rotate(45deg); opacity: 1; }
    }

    /* estado final */
    .bar.is-done { animation: ring 1.2s ease-out; }
    .bar.is-done .loading { opacity: 0; }
    .bar.is-done .done-text { animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) forwards; }
    .bar.is-done .fill { animation: flash .7s ease; }
    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    @keyframes flash { 0% { filter: brightness(1.9); } 100% { filter: brightness(1); } }
    @keyframes ring {
      0%   { box-shadow: 0 0 14px var(--glow), inset 0 0 12px rgba(0,150,255,.55), 0 0 0 0 rgba(24,200,255,.8); }
      100% { box-shadow: 0 0 14px var(--glow), inset 0 0 12px rgba(0,150,255,.55), 0 0 0 26px rgba(24,200,255,0); }
    }

    /* =========================================================
       IDENTIDAD DETECTADA
       ========================================================= */
    .identity {
      margin-top: 26px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(16px, 5vw, 34px);
    }
    .identity__col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
    }
    .identity__label {
      font-size: clamp(.6rem, 2.7vw, .9rem);
      white-space: nowrap;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
      line-height: 1;
    }
    .identity__value { height: clamp(30px, 8.6vw, 46px); width: auto; }
    .identity__sep {
      width: 1.5px;
      background: rgba(255, 255, 255, .55);
      transform: scaleY(0);
    }

    /* aparece "escaneado" de izquierda a derecha */
    .identity__col.is-in { animation: scanIn .8s steps(14) forwards; }
    .identity__sep.is-in { animation: grow .4s ease forwards; }
    @keyframes scanIn {
      from { opacity: 1; clip-path: inset(0 100% 0 0); }
      to   { opacity: 1; clip-path: inset(0 0 0 0); }
    }
    @keyframes grow { to { transform: scaleY(1); } }

    /* =========================================================
       MENSAJE + EASTER LEARNING
       ========================================================= */
    .message {
      margin-top: 28px;
      font-size: clamp(1.05rem, 4.5vw, 1.55rem);
      line-height: 1.22;
    }
    .message p { text-wrap: balance; }
    .message p + p { margin-top: 14px; }
    .message p:first-child { max-width: 32ch; margin-inline: auto; }
    .br-pc { display: none; }

    .brand { margin-top: 10px; }
    .brand img { width: min(80vw, 560px); filter: drop-shadow(0 0 16px rgba(24, 140, 255, .35)); }

    /* entrada escalonada */
    .reveal { opacity: 0; transform: translateY(14px); }
    .reveal.is-in { animation: rise .7s ease forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    /* =========================================================
       OJO DE EL OJO (esquina derecha) + LOGO DISNEY+
       ========================================================= */
    .eye {
      position: fixed;
      z-index: 1;
      right: -30vw;
      bottom: -14vw;
      width: 92vw;
      max-width: 760px;
      aspect-ratio: 1;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      opacity: 0;
      animation: appear 1.4s ease .3s forwards;
      -webkit-tap-highlight-color: transparent;
    }
    .eye__img {
      width: 100%;
      height: 100%;
      opacity: .6;
      filter: drop-shadow(0 0 1.5px rgba(70, 170, 255, .9)) drop-shadow(0 0 10px rgba(20, 130, 255, .45));
      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--rot, 0deg)) scale(var(--sc, 1));
      transition: filter .45s ease, opacity .45s ease, transform var(--dur, .35s) cubic-bezier(.2, .8, .2, 1);
      animation: float 7s ease-in-out infinite;
    }
    .eye:hover .eye__img,
    .eye.is-active .eye__img {
      opacity: 1;
      --sc: 1.04;
      filter: drop-shadow(0 0 2px rgba(150, 230, 255, 1)) drop-shadow(0 0 22px rgba(24, 200, 255, .8)) brightness(1.4);
    }
    .eye.is-blink .eye__img { animation: blink .45s ease; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes float  { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
    @keyframes blink  { 0%, 100% { scale: 1 1; } 45% { scale: 1 .08; } }

    .disney {
      position: absolute;
      z-index: 3;
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: clamp(84px, 24vw, 150px);
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, .45));
      opacity: 0;
      animation: appear 1s ease .6s forwards;
      pointer-events: none;
    }

    /* =========================================================
       PC
       ========================================================= */
    @media (min-width: 900px) {
      .screen { padding: 56px 40px 70px; }
      .title { gap: 0 2.2%; flex-wrap: nowrap; }
      .title img { height: clamp(60px, 7.2vw, 108px); }
      .subtitle { margin-top: 26px; }
      .meter { margin-top: 26px; }
      .identity { margin-top: 28px; }
      .message { margin-top: 44px; }
      .message p + p { margin-top: 20px; }
      .message p:first-child { max-width: none; }
      .br-pc { display: inline; }
      .brand img { width: 520px; }
      .eye { right: -140px; bottom: -200px; width: 640px; }
      .disney { right: 48px; bottom: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora, .bg__lines .flow, .fill::after, .spark, .eye, .eye__img, .disney { animation: none !important; }
      .eye, .disney { opacity: 1; }
      .reveal { opacity: 1; transform: none; }
      .reveal.is-in, .identity__col.is-in, .identity__sep.is-in, .bar.is-done .done-text { animation: none; opacity: 1; transform: none; clip-path: none; }
      .identity__col { opacity: 1; }
      .identity__sep { transform: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var wait = function (ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); };
      var $ = function (s) { return document.querySelector(s); };

      /* ---------------- Secuencia ---------------- */
      document.querySelectorAll('.reveal[data-t]').forEach(function (el) {
        setTimeout(function () { el.classList.add('is-in'); }, reduce ? 0 : +el.dataset.t);
      });

      var bar = $('.bar'), pct = $('.pct');

      function load() {
        return new Promise(function (resolve) {
          if (reduce) { bar.style.setProperty('--p', '100%'); return resolve(); }
          // [tiempo 0-1, %]: con pausas para que parezca que "piensa"
          var keys = [[0,0],[.15,12],[.27,19],[.36,21],[.52,55],[.63,61],[.7,62],[.86,90],[.93,97],[1,100]];
          var dur = 2000, t0;
          function frame(now) {
            if (!t0) t0 = now;
            var t = Math.min((now - t0) / dur, 1), p = 100;
            for (var i = 1; i < keys.length; i++) {
              if (t <= keys[i][0]) {
                var a = keys[i-1], b = keys[i];
                p = a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]);
                break;
              }
            }
            p = Math.round(p);
            bar.style.setProperty('--p', p + '%');
            pct.textContent = p + '%';
            if (t < 1) requestAnimationFrame(frame); else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      wait(800)
        .then(load)
        .then(function () { return wait(150); })
        .then(function () {
          bar.classList.add('is-done');
          bar.setAttribute('aria-label', 'Análisis completado');
          return wait(500);
        })
        .then(function () {
          var cols = document.querySelectorAll('.identity__col');
          cols[0].classList.add('is-in');
          $('.identity__sep').classList.add('is-in');
          return wait(450).then(function () { cols[1].classList.add('is-in'); return wait(800); });
        })
        .then(function () {
          var steps = document.querySelectorAll('.reveal[data-step]');
          steps.forEach(function (el, i) {
            setTimeout(function () { el.classList.add('is-in'); }, reduce ? 0 : i * 320);
          });
          return wait(steps.length * 320 + 300);
        })
        .then(function () { wakeEye(); });

      /* ---------------- Estrellitas del fondo ---------------- */
      var cv = $('.bg__stars'), ctx = cv.getContext('2d'), stars = [], shoot = null, dpr = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
        var n = Math.round(innerWidth * innerHeight / 9000);
        stars = [];
        for (var i = 0; i < n; i++) stars.push({
          x: Math.random() * cv.width, y: Math.random() * cv.height,
          r: (Math.random() * 1.3 + .3) * dpr, ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.2
        });
      }
      resize(); addEventListener('resize', resize);
      function draw(now) {
        var t = now / 1000;
        ctx.clearRect(0, 0, cv.width, cv.height);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i], a = reduce ? .5 : .25 + .75 * (.5 + .5 * Math.sin(t * s.sp + s.ph));
          ctx.fillStyle = 'rgba(170,225,255,' + (a * .8) + ')';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        // estrella fugaz cada tanto
        if (!reduce) {
          if (!shoot && Math.random() < .004) shoot = { x: Math.random() * cv.width * .6, y: Math.random() * cv.height * .35, l: 0 };
          if (shoot) {
            shoot.l += 1;
            var k = shoot.l * 14 * dpr, x = shoot.x + k, y = shoot.y + k * .35;
            var g = ctx.createLinearGradient(x - 120 * dpr, y - 42 * dpr, x, y);
            g.addColorStop(0, 'rgba(24,200,255,0)'); g.addColorStop(1, 'rgba(220,245,255,.9)');
            ctx.strokeStyle = g; ctx.lineWidth = 2 * dpr; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x - 120 * dpr, y - 42 * dpr); ctx.lineTo(x, y); ctx.stroke();
            if (shoot.l > 60) shoot = null;
          }
          requestAnimationFrame(draw);
        }
      }
      requestAnimationFrame(draw);

      /* ---------------- Ojo interactivo ---------------- */
      var eye = $('.eye'), img = eye.querySelector('.eye__img'), lastInput = 0, tiltOn = false;
      var brand = $('.brand');

      function gaze(x, y, dur) {
        if (reduce) return;
        var r = eye.getBoundingClientRect();
        var dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
        var d = Math.max(Math.hypot(dx, dy), 1), k = Math.min(d / 260, 1) * 24;
        img.style.setProperty('--dur', dur || '.35s');
        img.style.setProperty('--tx', (dx / d * k).toFixed(1) + 'px');
        img.style.setProperty('--ty', (dy / d * k).toFixed(1) + 'px');
        img.style.setProperty('--rot', (dx / d * 7).toFixed(1) + 'deg');
      }
      function userLook(x, y) { lastInput = Date.now(); gaze(x, y); }

      addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') userLook(e.clientX, e.clientY); }, { passive: true });
      addEventListener('pointerdown', function (e) { userLook(e.clientX, e.clientY); }, { passive: true });
      addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) userLook(t.clientX, t.clientY); }, { passive: true });

      // inclinar el celular mueve la mirada (iPhone pide permiso al tocar el ojo)
      function onTilt(e) {
        if (e.gamma == null) return;
        tiltOn = true; lastInput = Date.now();
        var gx = Math.max(-30, Math.min(30, e.gamma)) / 30, gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;
        img.style.setProperty('--dur', '.25s');
        img.style.setProperty('--tx', (gx * 24).toFixed(1) + 'px');
        img.style.setProperty('--ty', (gy * 18).toFixed(1) + 'px');
        img.style.setProperty('--rot', (gx * 7).toFixed(1) + 'deg');
      }
      if (!reduce && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
        addEventListener('deviceorientation', onTilt, { passive: true });
      }

      function pulse() {
        eye.classList.add('is-active');
        setTimeout(function () { eye.classList.remove('is-active'); }, 1100);
      }
      function blink() {
        eye.classList.remove('is-blink'); void eye.offsetWidth; eye.classList.add('is-blink');
      }

      // si nadie lo mueve, mira solo para todos lados
      function wander() {
        if (Date.now() - lastInput > 2500) {
          var w = innerWidth, h = innerHeight, x, y, roll = Math.random();
          if (roll < .3 && brand) { var b = brand.getBoundingClientRect(); x = b.left + b.width * Math.random(); y = b.top + b.height / 2; }
          else if (roll < .45) { x = w / 2; y = h / 2; }
          else { x = Math.random() * w; y = Math.random() * h; }
          gaze(x, y, (.6 + Math.random() * .6).toFixed(2) + 's');
        }
        setTimeout(wander, 1300 + Math.random() * 1700);
      }

      function wakeEye() {
        if (reduce) return;
        var b = brand.getBoundingClientRect();
        gaze(b.left + b.width / 2, b.top + b.height / 2, '.8s');
        pulse();
        setTimeout(wander, 1800);
        setInterval(blink, 5000);
        if (matchMedia('(hover: none)').matches) {
          setInterval(function () { if (Date.now() - lastInput > 2500) pulse(); }, 9000);
        }
      }

      var timer;
      eye.addEventListener('click', function () {
        if (!tiltOn && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (st) {
            if (st === 'granted') addEventListener('deviceorientation', onTilt, { passive: true });
          }).catch(function () {});
        }
        blink();
        eye.classList.add('is-active');
        if (navigator.vibrate) navigator.vibrate(15);
        clearTimeout(timer);
        timer = setTimeout(function () { eye.classList.remove('is-active'); }, 1400);
      });
      img.addEventListener('animationend', function (e) { if (e.animationName === 'blink') eye.classList.remove('is-blink'); });
    })();
  </script>
</body>
</html>
