<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Easter Learning</title>
  <meta name="description" content="¡Buen ojo! Encontraste un Easter Egg. Bienvenido a Easter Learning.">
  <meta name="theme-color" content="#121f45">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cabin+Condensed:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #121f45;
      --navy-deep: #0d1735;
      --white: #ffffff;
      --watermark: rgba(255, 255, 255, 0.07);
      --font-display: "Bungee", "Arial Black", sans-serif;
      --font-body: "Cabin Condensed", "Arial Narrow", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--font-body);
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Contenedor principal (foco: celular) ---------- */
    .screen {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 22px calc(48px + env(safe-area-inset-bottom));
      overflow: hidden;
      overflow: clip; /* evita que el foco del ojo desplace la pantalla */
    }

    .content {
      position: relative;
      z-index: 2;
      pointer-events: none;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Título ---------- */
    .title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.1rem, 11vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(1rem, 4.6vw, 1.5rem);
      white-space: nowrap;
    }

    /* ---------- Píldora "Análisis completado" ---------- */
    .pill {
      position: relative;
      margin-top: 18px;
      width: min(100%, 420px);
      height: 52px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
      overflow: clip; /* evita que el foco del ojo desplace la pantalla */
    }

    .pill__fill {
      position: absolute;
      inset: 0;
      background: var(--white);
      transform-origin: left center;
      transform: scaleX(0);
      animation: fill 1.4s cubic-bezier(.65,.05,.36,1) 0.4s forwards;
    }

    .pill__text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 3.8vw, 1.1rem);
      letter-spacing: 0.04em;
      color: var(--navy);
      opacity: 0;
      animation: appear 0.4s ease 1.7s forwards;
    }

    /* ---------- Mensaje ---------- */
    .message {
      margin-top: 36px;
      font-size: clamp(1rem, 4.3vw, 1.2rem);
      line-height: 1.35;
      text-wrap: balance;
    }
    .message p { text-wrap: balance; }
    .message p:first-child { max-width: 31ch; margin-inline: auto; }
    .br-pc { display: none; }   /* en celular el texto corre seguido */
    .title, .subtitle { text-wrap: balance; }

    .message p + p { margin-top: 12px; }

    .welcome { margin-top: 20px; }

    /* ---------- Logo Easter Learning ---------- */
    .brand__img { display:block; width:min(82vw, 440px); height:auto; }
    .brand {
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 8vw, 2.6rem);
      line-height: 1;
      text-transform: uppercase;
    }

    /* ---------- Logo de El Ojo: esquina derecha, difuminado e interactivo ---------- */
    .eye {
      position: absolute;
      z-index: 1;
      right: -16vw;
      bottom: -8vw;
      width: 74vw;
      max-width: 420px;
      aspect-ratio: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      animation: eyeIn 1.2s ease 2.8s forwards;
    }

    .eye__img {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.22;
      filter: blur(1.5px);
      /* difuminado hacia los bordes */
      -webkit-mask-image: radial-gradient(circle at 45% 45%, #000 30%, rgba(0,0,0,.55) 55%, transparent 75%);
              mask-image: radial-gradient(circle at 45% 45%, #000 30%, rgba(0,0,0,.55) 55%, transparent 75%);
      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--rot, 0deg)) scale(var(--sc, 1));
      transition: opacity .45s ease, filter .45s ease, transform var(--dur, .35s) cubic-bezier(.2,.8,.2,1);
      animation: float 6s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    .eye:hover .eye__img,
    .eye.is-active .eye__img {
      opacity: 0.6;
      filter: blur(0) drop-shadow(0 0 24px rgba(0, 176, 183, .55));
      --sc: 1.06;
    }

    .eye.is-blink .eye__img {
      animation: blink .45s ease;
    }

    .eye { background: none; border: 0; padding: 0; }

    @keyframes eyeIn { to { opacity: 1; } }
    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -10px; }
    }
    @keyframes blink {
      0%, 100% { scale: 1 1; }
      45%      { scale: 1 .08; }
    }

    /* ---------- Entrada escalonada ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.7s ease forwards;
    }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 2.0s; }
    .d4 { animation-delay: 2.3s; }
    .d5 { animation-delay: 2.6s; }

    @keyframes fill   { to { transform: scaleX(1); } }
    @keyframes appear { to { opacity: 1; } }
    @keyframes rise   { to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .pill__text { animation: none; opacity: 1; transform: none; }
      .eye { animation: none; opacity: 1; }
      .eye__img { animation: none; transition: opacity .3s ease; }
      .pill__fill { animation: none; transform: scaleX(1); }
    }

    /* ---------- Pantallas grandes (PC) ---------- */
    @media (min-width: 900px) {
      body { background: #5b5b5b; }

      .screen {
        min-height: 100vh;
        padding: 40px;
      }

      .frame {
        position: relative;
        width: min(92vw, 1000px);
        aspect-ratio: 16 / 10;
        background: var(--navy);
        border: 3px solid var(--navy-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      overflow: clip; /* evita que el foco del ojo desplace la pantalla */
        padding: 48px;
      }

      .content { max-width: 760px; }
      .title { font-size: 4.4rem; }
      .message { margin-top: 48px; }
      .message p:first-child { max-width: none; }
      .br-pc { display: inline; }
      .brand__img { width: 440px; }

      .eye {
        right: -70px;
        bottom: -100px;
        width: 360px;
      }
    }

    @media (max-width: 899px) {
      .frame { display: contents; }
    }
  </style>
</head>

  <script>
    (function () {
      var eye = document.querySelector('.eye');
      var img = eye.querySelector('.eye__img');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var lastInput = 0;          // última vez que el usuario movió mouse/dedo
      var brand = document.querySelector('.brand');

      // Mueve la mirada hacia un punto (x, y) de la pantalla
      function gaze(x, y, dur) {
        if (reduce) return;
        var r = eye.getBoundingClientRect();
        var dx = x - (r.left + r.width / 2);
        var dy = y - (r.top + r.height / 2);
        var max = 22;
        var d = Math.max(Math.hypot(dx, dy), 1);
        var k = Math.min(d / 260, 1) * max;
        img.style.setProperty('--dur', dur || '.35s');
        img.style.setProperty('--tx', (dx / d * k).toFixed(1) + 'px');
        img.style.setProperty('--ty', (dy / d * k).toFixed(1) + 'px');
        img.style.setProperty('--rot', (dx / d * 7).toFixed(1) + 'deg');
      }

      function userLook(x, y) { lastInput = Date.now(); gaze(x, y); }

      // PC: sigue el mouse · Celular: mira donde tocás o deslizás el dedo
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse') userLook(e.clientX, e.clientY);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) { userLook(e.clientX, e.clientY); }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        var t = e.touches[0]; if (t) userLook(t.clientX, t.clientY);
      }, { passive: true });

      // Celular: inclinar el teléfono mueve la mirada (Android directo; iPhone pide permiso al tocar el ojo)
      var tiltOn = false;
      function onTilt(e) {
        if (e.gamma == null) return;
        tiltOn = true;
        lastInput = Date.now();
        var gx = Math.max(-30, Math.min(30, e.gamma)) / 30;      // izquierda / derecha
        var gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;  // adelante / atrás
        img.style.setProperty('--dur', '.25s');
        img.style.setProperty('--tx', (gx * 22).toFixed(1) + 'px');
        img.style.setProperty('--ty', (gy * 18).toFixed(1) + 'px');
        img.style.setProperty('--rot', (gx * 7).toFixed(1) + 'deg');
      }
      if (!reduce && window.DeviceOrientationEvent &&
          typeof DeviceOrientationEvent.requestPermission !== 'function') {
        window.addEventListener('deviceorientation', onTilt, { passive: true });
      }

      // Modo vivo: si nadie lo mueve, el ojo mira solo para todos lados
      function wander() {
        if (!reduce && Date.now() - lastInput > 2500) {
          var w = window.innerWidth, h = window.innerHeight, x, y;
          var roll = Math.random();
          if (roll < 0.3 && brand) {             // a veces mira el logo de Easter Learning
            var b = brand.getBoundingClientRect();
            x = b.left + b.width * Math.random(); y = b.top + b.height / 2;
          } else if (roll < 0.45) {              // a veces te mira a vos (al centro)
            x = w / 2; y = h / 2;
          } else {                               // y si no, curiosea
            x = Math.random() * w; y = Math.random() * h;
          }
          gaze(x, y, (0.6 + Math.random() * 0.6).toFixed(2) + 's');
        }
        setTimeout(wander, 1300 + Math.random() * 1700);
      }

      // Cuando aparece "Easter Learning", el ojo se despierta y lo mira
      setTimeout(function () {
        if (reduce) return;
        if (brand) {
          var b = brand.getBoundingClientRect();
          gaze(b.left + b.width / 2, b.top + b.height / 2, '.8s');
        }
        pulse();
        setTimeout(wander, 1800);
      }, 3200);

      // Celular: cada tanto se ilumina solo para invitar a tocarlo
      function pulse() {
        eye.classList.add('is-active');
        setTimeout(function () { eye.classList.remove('is-active'); }, 1100);
      }
      if (!reduce && window.matchMedia('(hover: none)').matches) {
        setInterval(function () {
          if (Date.now() - lastInput > 2500) pulse();
        }, 9000);
      }

      // Tocar el ojo: parpadea y se ilumina un momento
      var timer;
      eye.addEventListener('click', function () {
        if (!tiltOn && window.DeviceOrientationEvent &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (st) {
            if (st === 'granted') window.addEventListener('deviceorientation', onTilt, { passive: true });
          }).catch(function () {});
        }
        eye.classList.remove('is-blink');
        void eye.offsetWidth;
        eye.classList.add('is-blink', 'is-active');
        if (navigator.vibrate) navigator.vibrate(15);
        clearTimeout(timer);
        timer = setTimeout(function () { eye.classList.remove('is-active'); }, 1400);
      });

      img.addEventListener('animationend', function (e) {
        if (e.animationName === 'blink') eye.classList.remove('is-blink');
      });

      // Parpadeo espontáneo cada tanto
      if (!reduce) {
        setInterval(function () {
          eye.classList.remove('is-blink');
          void eye.offsetWidth;
          eye.classList.add('is-blink');
        }, 5000);
      }
    })();
  </script>
